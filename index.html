<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube 抽選コメントルーレット</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      /* OBSで透過させるための設定 */
      background: transparent !important;
      color: #fff;
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* OBS配信用：左側の設定パネルやタイトルは非表示にする */
    .panel, h2 {
      display: none !important;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100%;
    }

    /* ルーレット部分のスタイル（背景透過） */
    .roulette-section {
      text-align: center;
      background: transparent !important;
      padding: 10px;
      border-radius: 10px;
      box-shadow: none !important;
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
    }

    /* 普段のブラウザ操作用（もし直接開いた時にも見やすくするスタイル） */
    @media screen and (min-width: 800px) {
      body {
        background: #121212 !important;
        padding: 20px;
        flex-direction: column;
      }
      .panel, h2 {
        display: block !important;
      }
      .container {
        gap: 20px;
        flex-wrap: wrap;
      }
      .panel {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        flex: 1;
        min-width: 320px;
        max-width: 500px;
      }
      .roulette-section {
        background: #1e1e1e !important;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        padding: 20px;
      }
    }

    .input-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }
    label { font-size: 13px; color: #aaa; }
    input {
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
    }
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-red { background: #ff0000; color: white; flex: 1; }
    .btn-red:hover:not(:disabled) { background: #cc0000; }
    .btn-gray { background: #555; color: white; }
    .btn-gray:hover:not(:disabled) { background: #444; }
    .btn-green { background: #28a745; color: white; flex: 1; }
    .btn-green:hover:not(:disabled) { background: #218838; }
    button:disabled { background: #333; color: #777; cursor: not-allowed; }

    #status { font-size: 13px; color: #aaa; margin-top: 10px; }
    
    #winner {
      font-size: 26px;
      font-weight: bold;
      color: #ffcc00;
      margin: 10px 0;
      min-height: 38px;
      text-shadow: 0 2px 8px rgba(255, 204, 0, 0.4);
    }
    #canvas-container {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 10px auto;
    }
    #pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #ffcc00;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      z-index: 10;
    }
    .list-section {
      margin-top: 20px;
      text-align: left;
    }
    .scroll-box {
      background: #121212;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
      margin-top: 5px;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-bottom: 1px solid #222;
    }
    .user-item:last-child { border-bottom: none; }
    .delete-btn {
      background: #a94442;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .delete-btn:hover { background: #843534; }
  </style>
</head>
<body>

  <h2>🎯 YouTube コメントルーレット</h2>

  <div class="container">
    <!-- 設定・参加者管理パネル -->
    <div class="panel">
      <h3>配信・接続設定</h3>
      
      <div class="input-group">
        <label>ライブ配信のURL / 動画ID</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>

      <div class="input-group">
        <label>抽出キーワード（例：抽選、応募、はーい など）</label>
        <input type="text" id="keyword" value="抽選" placeholder="キーワードを入力">
      </div>
      
      <div class="button-row">
        <button id="startBtn" class="btn-red" onclick="startMonitoring()">監視スタート</button>
        <button id="stopBtn" class="btn-gray" onclick="stopMonitoring()" disabled>停止</button>
      </div>
      <div id="status">未接続：URLを入力してスタートしてください</div>

      <div class="list-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label>参加者一覧 (<span id="count">0</span>名)</label>
          <button class="btn-gray" style="padding:2px 6px; font-size:11px;" onclick="resetUsers()">全員クリア</button>
        </div>
        <div id="user-list-box" class="scroll-box">まだ参加者がいません</div>
      </div>

      <div class="list-section">
        <label>当選履歴 (<span id="winner-count">0</span>件)</label>
        <div id="winner-history-box" class="scroll-box">まだ当選者はいません</div>
      </div>
    </div>

    <!-- ルーレット画面 -->
    <div class="roulette-section">
      <h3>ルーレット抽選</h3>
      <div id="winner"></div>

      <div id="canvas-container">
        <div id="pointer"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
      </div>

      <div style="display:flex; gap:10px; margin-top: 15px;">
        <button id="spinBtn" class="btn-green" onclick="spinRoulette()" disabled>ルーレットを回す！</button>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyCYLAvQzTGC37DOEj-Te9Gn4Gj_IiHsBw4";

    let users = new Map();
    let winnerHistory = [];
    let nextPageToken = null;
    let liveChatId = null;
    let isMonitoring = false;
    let pollTimer = null;
    let currentAngle = 0;

    function extractVideoId(input) {
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /[?&]v=([a-zA-Z0-9_-]{11})/
      ];
      for (const pattern of patterns) {
        const match = trimmed.match(pattern);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    async function startMonitoring() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const videoId = extractVideoId(urlInput);

      if (!videoId) return alert('有効なYouTubeのURLまたは動画IDを入力してください。');

      setStatus('配信情報を取得中...');

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails,snippet&id=${videoId}&key=${API_KEY}`);
        const data = await res.json();

        if (data.error) {
          setStatus('エラーが発生しました');
          return alert(`APIエラー: ${data.error.message}`);
        }

        const item = data.items?.[0];
        if (!item || !item.liveStreamingDetails?.activeLiveChatId) {
          setStatus('ライブチャットが見つかりませんでした');
          return alert('アクティブなライブチャットが見つかりません。現在配信中のライブURLかご確認ください。');
        }

        liveChatId = item.liveStreamingDetails.activeLiveChatId;
        isMonitoring = true;
        nextPageToken = null;

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        setStatus(`監視中：「${item.snippet.title}」`);

        pollChat();
      } catch (e) {
        console.error(e);
        setStatus('通信エラーが発生しました');
      }
    }

    function stopMonitoring() {
      isMonitoring = false;
      clearTimeout(pollTimer);
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      setStatus('監視を停止しました');
    }

    async function pollChat() {
      if (!isMonitoring) return;

      let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&key=${API_KEY}`;
      if (nextPageToken) url += `&pageToken=${nextPageToken}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          setStatus(`APIエラー: ${data.error.message}`);
          stopMonitoring();
          return;
        }

        nextPageToken = data.nextPageToken;
        let addedCount = 0;
        const targetKeyword = document.getElementById('keyword').value.trim();

        if (data.items) {
          data.items.forEach(item => {
            const message = item.snippet?.displayMessage || '';
            const authorId = item.authorDetails?.channelId;
            const authorName = item.authorDetails?.displayName;

            const alreadyWon = winnerHistory.some(w => w.id === authorId);
            if (targetKeyword && message.includes(targetKeyword) && authorId && !users.has(authorId) && !alreadyWon) {
              users.set(authorId, authorName);
              addedCount++;
            }
          });

          if (addedCount > 0) {
            updateUI();
          }
        }

        const waitTime = Math.max(data.pollingIntervalMillis || 5000, 5000);
        pollTimer = setTimeout(pollChat, waitTime);
      } catch (e) {
        console.error(e);
        pollTimer = setTimeout(pollChat, 10000);
      }
    }

    function updateUI() {
      const entries = Array.from(users.entries());
      document.getElementById('count').textContent = entries.length;

      const userBox = document.getElementById('user-list-box');
      if (entries.length === 0) {
        userBox.innerHTML = '<div style="color:#777; padding:4px;">参加者がいません</div>';
      } else {
        userBox.innerHTML = entries.map(([id, name]) => `
          <div class="user-item">
            <span>${escapeHtml(name)}</span>
            <button class="delete-btn" onclick="removeUser('${id}')">削除</button>
          </div>
        `).join('');
      }

      const historyBox = document.getElementById('winner-history-box');
      document.getElementById('winner-count').textContent = winnerHistory.length;
      if (winnerHistory.length === 0) {
        historyBox.innerHTML = '<div style="color:#777; padding:4px;">当選履歴はありません</div>';
      } else {
        historyBox.innerHTML = winnerHistory.map((w, idx) => `
          <div class="user-item">
            <span>🎁 ${escapeHtml(w.name)} <small style="color:#aaa;">(${w.time})</small></span>
            <button class="delete-btn" onclick="removeHistory(${idx})">削除</button>
          </div>
        `).join('');
      }

      document.getElementById('spinBtn').disabled = entries.length < 2;
      drawWheel(entries.map(e => e[1]));
    }

    function drawWheel(names) {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2, cy = canvas.height / 2, radius = 160;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (names.length === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#222';
        ctx.fill();
        ctx.fillStyle = '#777';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('参加者待ち (2名以上)', cx, cy);
        return;
      }

      const sliceAngle = (2 * Math.PI) / names.length;
      const colors = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#008080', '#e6beff', '#9a6324'];

      names.forEach((name, i) => {
        const start = currentAngle + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#121212';
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(name.slice(0, 12), radius - 12, 4);
        ctx.restore();
      });
    }

    function spinRoulette() {
      const entries = Array.from(users.entries());
      if (entries.length < 2) return;

      document.getElementById('spinBtn').disabled = true;
      document.getElementById('winner').textContent = '🎲 抽選中...';

      const spinDuration = 4500;
      const startTime = performance.now();
      const startAngle = currentAngle;
      const totalRotation = (Math.PI * 2 * 6) + Math.random() * Math.PI * 2;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);
        currentAngle = startAngle + totalRotation * easeOut;

        drawWheel(entries.map(e => e[1]));

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          const sliceAngle = (2 * Math.PI) / entries.length;
          const normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          const winnerIndex = Math.floor(normalizedAngle / sliceAngle);
          const [winnerId, winnerName] = entries[winnerIndex];

          users.delete(winnerId);
          const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          winnerHistory.unshift({ id: winnerId, name: winnerName, time: nowTime });

          document.getElementById('winner').textContent = `🎉 当選: ${winnerName} さん！`;
          document.getElementById('spinBtn').disabled = false;
          updateUI();
        }
      }
      requestAnimationFrame(animate);
    }

    function removeUser(id) {
      users.delete(id);
      updateUI();
    }

    function removeHistory(index) {
      winnerHistory.splice(index, 1);
      updateUI();
    }

    function resetUsers() {
      if (confirm('参加者を全員クリアしますか？')) {
        users.clear();
        document.getElementById('winner').textContent = '';
        updateUI();
      }
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    drawWheel([]);
  </script>
</body>
</html>
